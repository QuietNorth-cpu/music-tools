<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8ba79a">
<link rel="apple-touch-icon" href="https://acf0aa361d9a996c8.app.workbuddy.host/apple-touch-icon.png?sharecode=OUOSJFN7SH">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="和弦速查">
<title>级数和弦速查 · 即兴伴奏</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eae8e3;
  --card:#fbfaf7;
  --ink:#3d443f;
  --ink2:#6f776f;
  --ink3:#9aa19a;
  --line:#dedad3;
  --sage:#8ba79a;
  --sage-d:#6a887a;
  --sage-l:#e8ede9;
  --t9:#7ea992;
  --t11:#c1a077;
  --t13:#9b8ab0;
  --talt:#bf8681;
  --shadow:0 2px 10px rgba(95,102,96,.07),0 10px 26px rgba(95,102,96,.05);
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:radial-gradient(1100px 560px at 6% -10%,#f0f2ed 0%,transparent 62%),radial-gradient(900px 520px at 100% 0%,#f4efeb 0%,transparent 55%),var(--bg);
  min-height:100vh;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1240px;margin:0 auto;padding:0 14px 36px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 10px}
.brand h1{margin:0;font-size:18px;font-weight:650;letter-spacing:1px}
.brand .sub{display:block;font-size:10px;letter-spacing:2.4px;color:var(--ink3);margin-top:3px;font-weight:500}
.seg{display:inline-flex;background:#e3e1db;border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.seg button{
  border:0;background:transparent;color:var(--ink2);font-family:inherit;font-size:12.5px;
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s,transform .1s;
  white-space:nowrap;line-height:1.25;
}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(60,70,62,.14)}
.seg button:active{transform:scale(.94)}
.selwrap{position:relative;display:inline-flex;align-items:center}
.selwrap::after{content:"\25BE";position:absolute;right:12px;font-size:10px;color:var(--ink3);pointer-events:none}
#scaleSel{
  appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#f4f3ef;border-radius:999px;
  padding:7px 28px 7px 14px;font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:600;
  outline:none;transition:transform .1s;
}
#scaleSel:active{transform:scale(.97)}
.churchrow{display:none;gap:5px;flex-wrap:wrap;padding:7px 1px 0}
.churchrow.show{display:flex}
.chip{
  border:1px solid var(--line);background:#f4f3ef;border-radius:999px;padding:5px 11px;font-size:11.5px;
  color:var(--ink2);cursor:pointer;font-family:inherit;transition:transform .1s,background .15s,color .15s;line-height:1.3;
}
.chip.on{background:var(--sage);border-color:var(--sage-d);color:#fff;font-weight:600}
.chip:active{transform:scale(.93)}
.sticky{position:sticky;top:0;z-index:30;padding:6px 0 4px;background:linear-gradient(180deg,rgba(234,232,227,.97) 0%,rgba(234,232,227,.92) 78%,rgba(234,232,227,0) 100%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.keys{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;background:#e4e2dc;padding:4px;border-radius:13px}
.key{
  border:0;background:#f8f7f3;border-radius:10px;padding:8px 1px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:var(--ink);
  transition:transform .12s cubic-bezier(.3,1.4,.5,1),background .18s,box-shadow .18s,color .18s;
  min-height:34px;justify-content:center;
}
.key .kn{font-size:13px;font-weight:600;line-height:1.05;letter-spacing:.2px}
.key .ka{font-size:8.5px;line-height:1;color:var(--ink3);height:9px;letter-spacing:.3px}
.key.on{background:var(--sage);color:#fff;box-shadow:0 3px 9px rgba(106,136,122,.34)}
.key.on .ka{color:rgba(255,255,255,.72)}
.key:active{transform:scale(.92)}
.infobar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 2px 4px}
.info{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;min-width:0}
.kbig{font-size:15px;font-weight:650;color:var(--sage-d);letter-spacing:.3px}
.kmeta{font-size:11.5px;color:var(--ink3);letter-spacing:.6px}
.invhint{font-size:10.5px;color:var(--talt);letter-spacing:.3px}
.pianoWrap{margin:6px auto 0;max-width:560px;background:rgba(251,250,247,.85);border:1px solid var(--line);border-radius:13px;padding:7px 10px 4px;box-shadow:var(--shadow)}
.pianoScroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.piano{position:relative;height:78px;min-width:520px}
.pk{position:absolute;top:0;border-radius:0 0 5px 5px;cursor:pointer;transition:background .12s,box-shadow .12s}
.pk.w{background:linear-gradient(180deg,#fdfdfb 0%,#f2f1ec 82%,#e6e4de 100%);border:1px solid #d5d1c8;height:78px;z-index:1}
.pk.b{background:linear-gradient(180deg,#525c55 0%,#2e3630 100%);height:48px;z-index:2;border:1px solid #262d28}
.pk.w:hover{background:#f7f6f0}
.pk.lit{z-index:3}
.pk.w.lit{background:linear-gradient(180deg,#c3d7cb 0%,#8ba79a 100%);border-color:var(--sage-d);box-shadow:0 0 10px rgba(139,167,154,.55) inset}
.pk.b.lit{background:linear-gradient(180deg,#87a694 0%,#54745f 100%);border-color:#4a6753;box-shadow:0 0 9px rgba(139,167,154,.6)}
.pk .pl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:7.5px;color:#b0aca2;letter-spacing:.2px;pointer-events:none}
.pk .pl.strong{color:#98948a;font-size:8.5px;font-weight:600}
.pk.lit .pl{color:#3f5648}
.piano-cap{font-size:9px;color:var(--ink3);letter-spacing:.5px;margin-top:4px;text-align:center}
/* ── 卡片网格 ── */
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px;max-width:960px;margin-left:auto;margin-right:auto}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px 11px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  transition:transform .13s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,border-color .2s;
  will-change:transform;
}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(139,167,154,.07),transparent 42%)}
.card:active,.card.press{transform:scale(.972);box-shadow:0 1px 4px rgba(95,102,96,.14)}
.card.playing{border-color:var(--sage);box-shadow:0 0 0 2px rgba(139,167,154,.3),var(--shadow)}
.card.playing .roman{color:var(--sage)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.roman{font-size:20px;font-weight:600;line-height:1;color:var(--sage-d);letter-spacing:.5px;transition:color .2s}
.roman .mk{font-size:11px;vertical-align:super;margin-left:1px;opacity:.85}
.func{font-size:10px;padding:3px 9px;border-radius:999px;letter-spacing:.6px;font-weight:600;white-space:nowrap}
.f-T{background:#e6ece7;color:#5d7b6c}
.f-S{background:#e5eaf0;color:#5e7185}
.f-D{background:#f2e3de;color:#996756}
.f-C{background:#ece6ed;color:#7c6a80}
.cname{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.08;margin:8px 0 1px;min-height:25px}
.cname .slash{font-weight:400;font-size:15px;color:var(--ink2);letter-spacing:0}
.bassline{font-size:10.5px;color:var(--ink3);margin-bottom:2px;letter-spacing:.4px}
.bassline b{color:var(--sage-d);font-size:11.5px}
.staffbox{background:#f6f5f1;border-radius:12px;padding:1px 0;margin:6px auto 6px;overflow:hidden;max-width:204px}
.staff{display:block;width:100%;height:auto}
.chips{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:6px;min-height:17px}
.chips-label{font-size:9px;color:var(--ink3);letter-spacing:.8px;margin-right:1px}
.chipt{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:6px;letter-spacing:.2px;line-height:1.25}
.t9{background:#e4efe9;color:#4f7d66}
.t11{background:#f3ead9;color:#94743f}
.t13{background:#eae4f0;color:#6d5d80}
.talt{background:#f4e5e2;color:#9b6560}
.acts{display:flex;gap:6px}
.act{font-size:11px;
  flex:1;border:1px solid var(--line);background:#f4f3ef;border-radius:9px;padding:5px 4px;
  font-family:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
  transition:transform .1s,background .15s,border-color .15s;min-height:32px;
}
.act .ico{font-size:8px;opacity:.55}
.act.seven{background:#edf2ee;border-color:#cfdbd3;color:#4f6b5c;font-weight:600}
.act:active{transform:scale(.94);background:#e8e6e1}
.act.seven:active{background:#e2eae5}

/* ── 五度圈面板 ── */
.panel{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 12px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.panel-head h2{margin:0;font-size:14px;font-weight:650;letter-spacing:1.2px;color:var(--ink)}
.panel-head .ph-sub{font-size:10.5px;color:var(--ink3);letter-spacing:.4px}
.circleWrap{display:flex;justify-content:center;padding:2px 0 4px}
#circleSvg{width:100%;max-width:500px;height:auto;display:block}
#circleSvg path{transition:fill .18s}
#circleSvg text{user-select:none;-webkit-user-select:none}
.circ-cap{font-size:10px;color:var(--ink3);text-align:center;letter-spacing:.5px;margin-top:2px}
.foot{margin-top:18px;text-align:center;font-size:10px;color:#b3b0a9;letter-spacing:1px}
.card.flash::after{
  content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  box-shadow:0 0 0 2px rgba(139,167,154,.55) inset;animation:fl .45s ease-out;
}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
@media (max-width:720px){
  .keys{grid-template-columns:repeat(6,1fr)}
  .pianoWrap{margin:6px 0 0;max-width:none}
  .app{padding:0 10px 28px}
  .grid{grid-template-columns:1fr;gap:9px}
  .cname{font-size:24px}
  .topbar{padding:14px 0 8px}
  .seg button{padding:6px 11px;font-size:12px}
  .piano{min-width:520px;height:74px}
  .pk.w{height:74px}
  .pk.b{height:46px}
}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>级数和弦速查</h1>
      <span class="sub">IMPROV · 即兴伴奏应急</span>
    </div>
    <div class="seg" id="invSeg">
      <button data-inv="0" class="on">原位</button>
      <button data-inv="1">一转</button>
      <button data-inv="2">二转</button>
      <button data-inv="3">三转</button>
    </div>
  </header>

  <div class="sticky">
    <div class="keys" id="keys"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px">
      <div class="selwrap"><select id="scaleSel"></select></div>
      <span class="invhint" id="invHint"></span>
    </div>
    <div class="churchrow" id="churchRow"></div>
    <div class="pianoWrap">
      <div class="pianoScroll"><div class="piano" id="piano"></div></div>
      <div class="piano-cap">钢琴键位 · 试听和弦时对应琴键亮起 · 可直接点击琴键试音</div>
    </div>
  </div>

  <div class="infobar">
    <div class="info" id="info"></div>
  </div>

  <main class="grid" id="grid"></main>

  <section class="panel">
    <div class="panel-head">
      <h2>五度圈 · Circle of Fifths</h2>
      <span class="ph-sub">点击圈内任意大调 / 小调查看调名 · 与上方卡片界面相互独立</span>
    </div>
    <div class="circleWrap">
      <svg id="circleSvg" viewBox="0 0 360 360" role="img" aria-label="五度圈"></svg>
    </div>
    <div class="circ-cap">外圈顺时针为纯五度上行 · 默认 C 自然大调 · 点选后中心显示该调名称</div>
  </section>

  <div class="foot">Web Audio 拟三角钢琴多谐波合成 · 五度圈速查 · 全部离线 · 手机无声请检查静音开关与媒体音量，微信内请选「在浏览器中打开」</div>
</div>
<script>
(function () {
'use strict';

/* ══════════════ 工具 ══════════════ */
var $ = function (s) { return document.querySelector(s); };
var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
function el(tag, cls, txt) {

  if (cls) e.className = cls;

}
var NS = 'http://www.w3.org/2000/svg';

  var e = document.createElementNS(NS, tag);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]);
  return e;
}

/* ══════════════ 乐理数据 ══════════════ */
var LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
var LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
var ACC = ['\u266D\u266D', '\u266D', '', '\u266F', '\u266F\u266F'];
var accStr = function (a) { return ACC[clamp(a + 2, 0, 4)] || ''; };
var ROMAN_UP = ['\u2160', '\u2161', '\u2162', '\u2163', '\u2164', '\u2165', '\u2166'];
var ROMAN_LO = ['\u2170', '\u2171', '\u2172', '\u2173', '\u2174', '\u2175', '\u2176'];

/* 12 个主音，alt = 同音异名 */
var KEYS = [
  { L: 0, a: 0,  alt: '' },        /* C  */
  { L: 1, a: -1, alt: 'C\u266F' }, /* D♭ */
  { L: 1, a: 0,  alt: '' },        /* D  */
  { L: 2, a: -1, alt: 'D\u266F' }, /* E♭ */
  { L: 2, a: 0,  alt: '' },        /* E  */
  { L: 3, a: 0,  alt: '' },        /* F  */
  { L: 3, a: 1,  alt: 'G\u266D' }, /* F♯ */
  { L: 4, a: 0,  alt: '' },        /* G  */
  { L: 5, a: -1, alt: 'G\u266F' }, /* A♭ */
  { L: 5, a: 0,  alt: '' },        /* A  */
  { L: 6, a: -1, alt: 'A\u266F' }, /* B♭ */
  { L: 6, a: 0,  alt: '' }         /* B  */
];
function keyName(k) { return LETTERS[k.L] + accStr(k.a); }

/* 音阶库：相对主音的半音数 */
var SCALES = [
  { id: 'major',  name: '自然大调', steps: [0, 2, 4, 5, 7, 9, 11] },
  { id: 'nminor', name: '自然小调', steps: [0, 2, 3, 5, 7, 8, 10] },
  { id: 'hminor', name: '和声小调', steps: [0, 2, 3, 5, 7, 8, 11] },
  { id: 'mminor', name: '旋律小调', steps: [0, 2, 3, 5, 7, 9, 11] },
  { id: 'hmajor', name: '和声大调', steps: [0, 2, 4, 5, 7, 8, 11] },
  { id: 'mmajor', name: '旋律大调', steps: [0, 2, 4, 5, 7, 8, 10] },
  { id: 'church', name: '教会调式', steps: null }
];
var CHURCH = [
  { name: '伊奥尼亚 Ionian',      steps: [0, 2, 4, 5, 7, 9, 11] },
  { name: '多利亚 Dorian',        steps: [0, 2, 3, 5, 7, 9, 10] },
  { name: '弗里吉亚 Phrygian',    steps: [0, 1, 3, 5, 7, 8, 10] },
  { name: '利底亚 Lydian',        steps: [0, 2, 4, 6, 7, 9, 11] },
  { name: '混合利底亚 Mixolydian', steps: [0, 2, 4, 5, 7, 9, 10] },
  { name: '爱奥尼亚 Aeolian',     steps: [0, 2, 3, 5, 7, 8, 10] },
  { name: '洛克里亚 Locrian',     steps: [0, 1, 3, 5, 6, 8, 10] }
];

/* 按主音生成音阶：字母顺序递进，升降号由目标音高反推（严格拼写） */
function buildScale(key, steps) {
  var base = (LETTER_PC[key.L] + key.a + 24) % 12;
  var out = [];
  for (var i = 0; i < 7; i++) {
    var target = (base + steps[i]) % 12;
    var L = (key.L + i) % 7;
    var a = target - LETTER_PC[L];
    while (a > 6) a -= 12;
    while (a < -6) a += 12;
    out.push({ L: L, a: a, pc: (LETTER_PC[L] + a + 48) % 12 });
  }
  return out;
}

/* 三度堆叠：j=0 根音 / 1 三音 / 2 五音 / 3 七音 / 4,5,6 = 9,11,13 扩展音 */
function stackNote(scale, keyL, Lr, j, oct) {
  var abs = Lr + 2 * j;
  var L = ((abs % 7) + 7) % 7;
  var o = oct + Math.floor(abs / 7);
  var s = scale[((L - keyL) % 7 + 7) % 7];
  return {
    L: L, a: s.a, pc: s.pc, oct: o,
    midi: 12 * (o + 1) + LETTER_PC[L] + s.a,
    deg: (((L - keyL) % 7 + 7) % 7) + 1,
    shift: o - oct
  };
}
function noteName(n) { return LETTERS[n.L] + accStr(n.a); }

/* 和弦性质（含增三、减七等） */
function quality(notes) {
  var r = notes[0].midi;
  var t = notes[1].midi - r;
  var f = notes[2].midi - r;
  var s = notes.length > 3 ? notes[3].midi - r : null;
  var tq = t === 4 ? 'M' : (t === 3 ? 'm' : '?');
  var fq = f === 7 ? 'P' : (f === 8 ? 'A' : (f === 6 ? 'd' : '?'));
  var sq = '?';
  if (s === 11) sq = fq === 'A' ? 'aM' : (tq === 'm' ? 'mM' : 'M');
  else if (s === 10) sq = (fq === 'P' && tq === 'M') ? 'D' : 'm';
  else if (s === 9) sq = 'd';
  else if (s === 8) sq = 'a';
  return { tq: tq, fq: fq, sq: sq };
}
function symTriad(root, q) {
  if (q.fq === 'd') return root + 'dim';
  if (q.fq === 'A') return root + 'aug';
  if (q.tq === 'm') return root + 'm';
  return root;
}
function symSeventh(root, q) {
  if (q.sq === 'M') return root + 'maj7';
  if (q.sq === 'mM') return root + 'mMaj7';
  if (q.sq === 'aM') return root + 'augMaj7';
  if (q.sq === 'D') return root + '7';
  if (q.sq === 'm') return q.fq === 'd' ? root + 'm7\u266D5' : root + 'm7';
  if (q.sq === 'd') return root + 'dim7';
  if (q.sq === 'a') return root + 'aug7';
  return root + '?7';
}
function qkey(q) {
  if (q.sq === 'M') return 'maj7';
  if (q.sq === 'mM') return 'mMaj7';
  if (q.sq === 'aM') return 'augMaj7';
  if (q.sq === 'D') return '7';
  if (q.sq === 'm') return q.fq === 'd' ? 'm7b5' : 'm7';
  if (q.sq === 'd') return 'dim7';
  if (q.sq === 'a') return 'aug7';
  return 'maj7';
}

/* 功能标签（按级数位置） */
var FUNC = [
  { t: '\u4E3B', k: 'T' }, { t: '\u4E0B\u5C5E', k: 'S' }, { t: '\u8272\u5F69', k: 'C' },
  { t: '\u4E0B\u5C5E', k: 'S' }, { t: '\u5C5E', k: 'D' }, { t: '\u8272\u5F69', k: 'C' },
  { t: '\u5C5E', k: 'D' }
];

/* 可用扩展音：j 为三度堆叠序号（4=9 音,5=11 音,6=13 音），alt 为半音修正 */
var TENS = {
  maj7:    { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '\u266F11', c: 't11', alt: 1 }, { j: 6, l: '13', c: 't13' }],
             chips: [{ l: '9', c: 't9' }, { l: '\u266F11', c: 't11' }, { l: '13', c: 't13' }] },
  '7':     { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '\u266F11', c: 't11', alt: 1 }, { j: 6, l: '13', c: 't13' }],
             chips: [{ l: '9', c: 't9' }, { l: '\u266D9', c: 'talt' }, { l: '\u266F9', c: 'talt' },
                     { l: '\u266F11', c: 't11' }, { l: '\u266D13', c: 'talt' }, { l: '13', c: 't13' }] },
  m7:      { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '11', c: 't11' }],
             chips: [{ l: '9', c: 't9' }, { l: '11', c: 't11' }] },
  mMaj7:   { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '11', c: 't11' }, { j: 6, l: '13', c: 't13' }],
             chips: [{ l: '9', c: 't9' }, { l: '11', c: 't11' }, { l: '13', c: 't13' }] },
  m7b5:    { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '11', c: 't11' }],
             chips: [{ l: '9', c: 't9' }, { l: '11', c: 't11' }, { l: '\u266D13', c: 'talt' }] },
  dim7:    { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '11', c: 't11' }],
             chips: [{ l: '9', c: 't9' }, { l: '11', c: 't11' }] },
  aug7:    { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '\u266F11', c: 't11', alt: 1 }],
             chips: [{ l: '9', c: 't9' }, { l: '\u266F11', c: 't11' }] },
  augMaj7: { staff: [{ j: 4, l: '9', c: 't9' }, { j: 5, l: '\u266F11', c: 't11', alt: 1 }],
             chips: [{ l: '9', c: 't9' }, { l: '\u266F11', c: 't11' }] }
};

/* 转位 */
function invert(notes, inv) {
  var k = clamp(inv, 0, notes.length - 1);
  var out = [], i, n;
  for (i = k; i < notes.length; i++) out.push(notes[i]);
  for (i = 0; i < k; i++) {
    n = notes[i];
    out.push({ L: n.L, a: n.a, pc: n.pc, oct: n.oct + 1, midi: n.midi + 12, deg: n.deg, shift: n.shift + 1 });
  }
  return out;
}
/* ══════════════ 音频引擎（拟三角钢琴） ══════════════ */
var A = { ctx: null, dry: null, conv: null, waves: null, voices: [], noiseBuf: null };

function makeIR(ctx, dur, decay) {
  var rate = ctx.sampleRate;
  var len = Math.max(1, Math.floor(rate * dur));
  var buf = ctx.createBuffer(2, len, rate);
  for (var ch = 0; ch < 2; ch++) {
    var d = buf.getChannelData(ch);
    var lp = 0;
    var pre = Math.floor(rate * 0.009);
    for (var i = 0; i < len; i++) {
      var n = Math.random() * 2 - 1;
      lp = lp * 0.58 + n * 0.42;
      var v = lp * Math.pow(1 - i / len, decay);
      if (i < pre) v *= i / pre;
      d[i] = v;
    }
  }
  return buf;
}
function makeNoise(ctx, dur) {
  var len = Math.floor(ctx.sampleRate * dur);
  var buf = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

/* 三组谐波列：琴体 / 泛音 / 击弦亮泽 */
function makeWaves(ctx) {
  var N = 28;
  function mk(fn) {
    var real = new Float32Array(N), imag = new Float32Array(N);
    for (var k = 1; k < N; k++) imag[k] = fn(k);
    return ctx.createPeriodicWave(real, imag);
  }
  return {
    body: mk(function (k) { return Math.pow(k, -1.55) * (k % 2 ? 1 : 0.8) * Math.exp(-k / 22); }),
    rich: mk(function (k) { return (k % 2 ? Math.pow(k, -2.1) : 0) * Math.exp(-k / 18); }),
    bright: mk(function (k) { return k > 18 ? 0 : Math.pow(k, -0.78) * (k % 3 === 0 ? 0.6 : 1); })
  };
}

function buildAudio() {
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx = new Ctx({ latencyHint: 'interactive' });
  A.ctx = ctx;

  var comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16;
  comp.knee.value = 26;
  comp.ratio.value = 3.2;
  comp.attack.value = 0.004;
  comp.release.value = 0.24;

  var master = ctx.createGain();
  master.gain.value = 0.72;
  comp.connect(master);
  master.connect(ctx.destination);

  var dry = ctx.createGain(); dry.gain.value = 0.92;
  var wet = ctx.createGain(); wet.gain.value = 0.24;
  var conv = ctx.createConvolver();
  conv.buffer = makeIR(ctx, 1.9, 2.9);
  dry.connect(comp);
  conv.connect(wet);
  wet.connect(comp);

  A.master = master;
  A.dry = dry;
  A.conv = conv;
  A.waves = makeWaves(ctx);
  A.noiseBuf = makeNoise(ctx, 0.05);
}

function ensureAudio() {
  if (!A.ctx) buildAudio();
  if (A.ctx.state === 'suspended') {
    return A.ctx.resume().then(function () { return A.ctx; })
      .catch(function () { return A.ctx; });
  }
  return Promise.resolve(A.ctx);
}

/* 钢琴包络：4ms 起音 → 快衰减 → 慢衰减（双段更接近真实弦衰减） */
function pianoEnv(g, peak, t0, tauBody) {
  var p = g.gain;
  p.setValueAtTime(0.0001, t0);
  p.linearRampToValueAtTime(peak, t0 + 0.004);
  p.setTargetAtTime(peak * 0.34, t0 + 0.004, 0.16);
  p.setTargetAtTime(0.0001, t0 + 0.34, tauBody);
}
function dampen(g, t) { g.gain.setTargetAtTime(0.0001, t, 0.08); }

/* 击弦噪音（琴槌 + 琴键机械感） */
function hammer(when, vel, midi) {
  var ctx = A.ctx;
  var src = ctx.createBufferSource();
  src.buffer = A.noiseBuf;
  var bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = clamp(900 + midi * 16, 900, 4200);
  bp.Q.value = 1.0;
  var g = ctx.createGain();
  g.gain.setValueAtTime(vel * 0.13, when);
  g.gain.setTargetAtTime(0.0001, when + 0.004, 0.011);
  src.connect(bp); bp.connect(g);
  g.connect(A.dry); g.connect(A.conv);
  src.start(when); src.stop(when + 0.06);
}

/* 合成一个钢琴音 */
function pluck(midi, when, vel, dur) {
  var ctx = A.ctx;
  if (!ctx) return;
  when = Math.max(when, ctx.currentTime + 0.002);
  var f = 440 * Math.pow(2, (midi - 69) / 12);
  if (f < 20 || f > 9500) return;

  var out = ctx.createGain();
  out.gain.value = 1;
  var filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.Q.value = 0.32;
  filt.frequency.setValueAtTime(clamp(1100 + f * 8.5, 1200, 12000), when);
  filt.frequency.setTargetAtTime(clamp(480 + f * 1.05, 480, 3800), when + 0.005, 0.30);
  filt.connect(out);

  var pan = ctx.createStereoPanner();
  pan.pan.value = clamp((midi - 63) / 70, -0.34, 0.34);
  out.connect(pan);
  pan.connect(A.dry);
  pan.connect(A.conv);

  var tauBody = clamp(2.9 * Math.pow(261.63 / f, 0.42), 0.8, 4.4);

  /* 层1 琴体 */
  var o1 = ctx.createOscillator();
  o1.setPeriodicWave(A.waves.body);
  o1.frequency.value = f;
  o1.detune.value = -4;
  var g1 = ctx.createGain();
  o1.connect(g1); g1.connect(filt);
  pianoEnv(g1, vel * 0.62, when, tauBody);
  /* 层2 奇次泛音（琴弦质感） */
  var o2 = ctx.createOscillator();
  o2.setPeriodicWave(A.waves.rich);
  o2.frequency.value = f;
  o2.detune.value = 3;
  var g2 = ctx.createGain();
  o2.connect(g2); g2.connect(filt);
  pianoEnv(g2, vel * 0.22, when, tauBody * 0.7);
  /* 层3 击弦亮泽（很快消失） */
  var o3 = ctx.createOscillator();
  o3.setPeriodicWave(A.waves.bright);
  o3.frequency.value = f;
  o3.detune.value = 6;
  var g3 = ctx.createGain();
  o3.connect(g3); g3.connect(filt);
  pianoEnv(g3, vel * 0.34, when, 0.09);

  var rel = when + dur;
  dampen(g1, rel);
  dampen(g2, rel);
  dampen(g3, rel);

  var stopAt = rel + 1.1;
  o1.start(when); o2.start(when); o3.start(when);
  o1.stop(stopAt); o2.stop(stopAt); o3.stop(stopAt);

  hammer(when, vel, midi);

  A.voices.push({ o1: o1, o2: o2, o3: o3, g1: g1, g2: g2, g3: g3, end: stopAt });
  if (A.voices.length > 160) {
    var now = ctx.currentTime;
    A.voices = A.voices.filter(function (v) { return v.end > now; });
  }
}

function stopAllVoices() {
  if (!A.ctx) return;
  var now = A.ctx.currentTime;
  for (var i = 0; i < A.voices.length; i++) {
    var v = A.voices[i];
    try {
      dampen(v.g1, now); dampen(v.g2, now); dampen(v.g3, now);
      v.o1.stop(now + 0.45); v.o2.stop(now + 0.45); v.o3.stop(now + 0.45);
    } catch (e) { /* 已停止 */ }
  }
  A.voices = [];
}

function playNotes(midis, vel, dur, strum, extra) {
  ensureAudio().then(function (ctx) {
    var t = ctx.currentTime + 0.012;
    for (var i = 0; i < midis.length; i++) {
      pluck(midis[i], t + i * strum, vel, dur);
    }
    if (extra) extra(t);
  });
}
/* ══════════════ 钢琴键位 ══════════════ */
var KB_LO = 60, KB_HI = 83;   /* C4 – B5 两个八度 */
var isBlackPc = { 1: 1, 3: 1, 6: 1, 8: 1, 10: 1 };

function buildPiano() {
  var box = $('#piano');
  box.innerHTML = '';
  var whites = 0, m, k;
  for (m = KB_LO; m <= KB_HI; m++) if (!isBlackPc[m % 12]) whites++;
  var unit = 100 / whites;
  var wi = 0;
  for (m = KB_LO; m <= KB_HI; m++) {
    var pc = m % 12;
    if (!isBlackPc[pc]) {
      k = el('div', 'pk w');
      k.style.left = (wi * unit) + '%';
      k.style.width = (unit * 0.94) + '%';
      k.dataset.midi = m;
      var lb = el('span', 'pl' + (pc === 0 ? ' strong' : ''),
        LETTERS[[0, 2, 4, 5, 7, 9, 11].indexOf(pc)] + (Math.floor(m / 12) - 1));
      k.appendChild(lb);
      box.appendChild(k);
      wi++;
    } else {
      k = el('div', 'pk b');
      k.style.left = (wi * unit - unit * 0.3) + '%';
      k.style.width = (unit * 0.6) + '%';
      k.dataset.midi = m;
      box.appendChild(k);
    }
  }
}

var kbTimers = [];
function clearKeys() {
  kbTimers.forEach(function (t) { clearTimeout(t); });
  kbTimers = [];
  var a = document.querySelectorAll('.pk.lit');
  for (var i = 0; i < a.length; i++) a[i].classList.remove('lit');
}
function lightKeys(midis, keep) {
  if (!keep) clearKeys();
  var seen = {};
  midis.forEach(function (mm) {
    while (mm < KB_LO) mm += 12;
    while (mm > KB_HI) mm -= 12;
    if (seen[mm]) return;
    seen[mm] = 1;
    var k = document.querySelector('.pk[data-midi="' + mm + '"]');
    if (k) {
      k.classList.add('lit');
      kbTimers.push(setTimeout(function () { k.classList.remove('lit'); }, 1400));
    }
  });
}

/* ══════════════ 五线谱 ══════════════ */
var COLORS = { t9: '#6d9b84', t11: '#a9865a', t13: '#82719c', talt: '#b0746e' };

function buildStaff(card) {
  var W = 252, H = 146, TOP = 66, GAP = 12, X = 116;
  var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, 'class': 'staff', preserveAspectRatio: 'xMidYMid meet' });
  var yOfD = function (d) { return TOP + (38 - d) * (GAP / 2); };
  var dOf = function (n) { return 7 * n.oct + n.L; };

  for (var i = 0; i < 5; i++) {
    var y = TOP + i * GAP;
    svg.appendChild(sv('line', { x1: 11, y1: y, x2: W - 11, y2: y, stroke: '#dad6ce', 'stroke-width': 1 }));
  }
  var clef = sv('text', {
    x: 31, y: 87, 'font-size': 50, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    fill: '#b2bbb3',
    'font-family': '"Noto Music","Bravura Text","Segoe UI Symbol","Apple Symbols","Arial Unicode MS","DejaVu Sans",serif'
  });
  clef.textContent = '\uD834\uDD1E';
  svg.appendChild(clef);

  function ledgers(d) {
    var out = [], v;
    if (d < 30) { for (v = 28; v >= d; v -= 2) out.push(v); }
    else if (d > 38) { for (v = 40; v <= d; v += 2) out.push(v); }
    return out;
  }
  function draw(n, fill) {
    var d = dOf(n), yy = yOfD(d);
    ledgers(d).forEach(function (v) {
      svg.appendChild(sv('line', { x1: X - 15, y1: yOfD(v), x2: X + 15, y2: yOfD(v), stroke: '#dad6ce', 'stroke-width': 1 }));
    });
    svg.appendChild(sv('ellipse', {
      cx: X, cy: yy, rx: 6.2, ry: 4.5, fill: fill,
      transform: 'rotate(-18 ' + X + ' ' + yy + ')'
    }));
    if (n.a !== 0) {
      var t = sv('text', { x: X - 15, y: yy + 4.7, 'font-size': 14.5, 'text-anchor': 'middle', fill: fill });
      t.textContent = accStr(n.a);
      svg.appendChild(t);
    }
    return yy;
  }

  card.seventh.forEach(function (n) { draw(n, '#4c564f'); });
  card.tens.forEach(function (t) {
    var yy = draw(t.note, COLORS[t.cls]);
    var lab = sv('text', {
      x: X + 13, y: yy + 3.2, 'font-size': 8.6, 'text-anchor': 'start',
      fill: COLORS[t.cls], 'font-weight': 700, 'letter-spacing': '0.2'
    });
    lab.textContent = t.lab;
    svg.appendChild(lab);
  });
  return svg;
}

/* ══════════════ 模型 ══════════════ */
var state = { tonic: 0, scaleIdx: 0, churchIdx: 0, inv: 0, circle: { mode: 'major', tonic: 0 } };
var model = null;

function currentSteps() {
  var sc = SCALES[state.scaleIdx];
  return sc.steps ? sc.steps : CHURCH[state.churchIdx].steps;
}
function currentScaleName() {
  var sc = SCALES[state.scaleIdx];
  return sc.steps ? sc.name : CHURCH[state.churchIdx].name.split(' ')[0];
}

function buildModel() {
  var key = KEYS[state.tonic];
  var scale = buildScale(key, currentSteps());
  var keyL = key.L;
  var cards = [], byScale = {};

  for (var pos = 0; pos < 7; pos++) {
    var Lr = scale[pos].L;
    var root = stackNote(scale, keyL, Lr, 0, 4);
    var triad = [0, 1, 2].map(function (j) { return stackNote(scale, keyL, Lr, j, 4); });
    var seventh = [0, 1, 2, 3].map(function (j) { return stackNote(scale, keyL, Lr, j, 4); });
    var q = quality(seventh);
    var rootName = noteName(root);
    var kk = qkey(q);
    var T = TENS[kk] || TENS.maj7;
    var tensNotes = T.staff.map(function (t) {
      var n = stackNote(scale, keyL, Lr, t.j, 4);
      if (t.alt) { n.a += t.alt; n.midi += t.alt; }
      return { note: n, lab: t.l, cls: t.c };
    });

    var card = {
      pos: pos, si: pos, root: root, q: q, qk: kk,
      triad: triad, seventh: seventh,
      triadSym: symTriad(rootName, q),
      seventhSym: symSeventh(rootName, q),
      roman: q.tq === 'M' ? ROMAN_UP[pos] : ROMAN_LO[pos],
      mark: q.fq === 'd' ? '\u00B0' : (q.fq === 'A' ? '+' : ''),
      funcT: FUNC[pos].t, funcK: FUNC[pos].k,
      tens: tensNotes, chips: T.chips
    };
    cards.push(card);
    byScale[pos] = card;
  }
  return { key: key, scale: scale, cards: cards, byScale: byScale };
}
/* ══════════════ 渲染 ══════════════ */
function renderKeys() {
  var box = $('#keys');
  box.innerHTML = '';
  KEYS.forEach(function (k, i) {
    var b = el('button', 'key' + (i === state.tonic ? ' on' : ''));
    b.type = 'button';
    b.dataset.idx = i;
    b.appendChild(el('span', 'kn', keyName(k)));
    b.appendChild(el('span', 'ka', k.alt || '\u00A0'));
    box.appendChild(b);
  });
}

function renderScaleUI() {
  var sel = $('#scaleSel');
  if (!sel.options.length) {
    SCALES.forEach(function (s, i) {
      var o = el('option', null, s.name);
      o.value = i;
      sel.appendChild(o);
    });
    sel.value = state.scaleIdx;
  }
  sel.value = state.scaleIdx;
  var row = $('#churchRow');
  row.innerHTML = '';
  if (SCALES[state.scaleIdx].id === 'church') {
    row.classList.add('show');
    CHURCH.forEach(function (c, i) {
      var b = el('button', 'chip' + (i === state.churchIdx ? ' on' : ''), c.name);
      b.type = 'button';
      b.dataset.ci = i;
      row.appendChild(b);
    });
  } else {
    row.classList.remove('show');
  }
}

function renderInfo() {
  var info = $('#info');
  info.innerHTML = '';
  var order = [0, 1, 2, 3, 4, 5, 6];
  info.appendChild(el('span', 'kbig',
    noteName(model.scale[0]) + ' ' + currentScaleName()));
  info.appendChild(el('span', 'kmeta',
    '音阶 ' + order.map(function (i) { return noteName(model.scale[i]); }).join(' ')));
  $('#invHint').textContent = state.inv === 3 ? '三转仅七和弦' : '';
}

function renderCards() {
  var grid = $('#grid');
  grid.innerHTML = '';

  model.cards.forEach(function (card) {
    var c = el('div', 'card');
    c.dataset.pos = card.pos;
    c.dataset.si = card.si;

    var head = el('div', 'chead');
    var roman = el('div', 'roman');
    roman.appendChild(document.createTextNode(card.roman));
    roman.appendChild(el('span', 'mk', card.mark ? card.mark + '7' : '7'));
    head.appendChild(roman);
    head.appendChild(el('div', 'func f-' + card.funcK, card.funcT + ' ' + card.funcK));
    c.appendChild(head);

    var invSev = invert(card.seventh, state.inv);
    var name = el('div', 'cname');
    name.appendChild(document.createTextNode(card.seventhSym));
    if (state.inv > 0) name.appendChild(el('span', 'slash', '/' + noteName(invSev[0])));
    c.appendChild(name);

    if (state.inv > 0) {
      var bl = el('div', 'bassline');
      bl.appendChild(document.createTextNode('低音级数 '));
      bl.appendChild(el('b', null, String(invSev[0].deg)));
      bl.appendChild(document.createTextNode(' \u00B7 ' + noteName(invSev[0])));
      c.appendChild(bl);
    } else {
      c.appendChild(el('div', 'bassline', '低音级数 ' + card.root.deg));
    }

    var box = el('div', 'staffbox');
    box.appendChild(buildStaff(card));
    c.appendChild(box);

    var chips = el('div', 'chips');
    chips.appendChild(el('span', 'chips-label', '可用扩展'));
    card.chips.forEach(function (t) { chips.appendChild(el('span', 'chipt ' + t.c, t.l)); });
    c.appendChild(chips);

    var acts = el('div', 'acts');
    var b1 = el('button', 'act seven');
    b1.type = 'button';
    b1.appendChild(el('span', 'ico', '\u25B6'));
    b1.appendChild(document.createTextNode(' 试听 ' + card.seventhSym +
      (state.inv > 0 ? '/' + noteName(invSev[0]) : '')));
    acts.appendChild(b1);
    c.appendChild(acts);

    grid.appendChild(c);
  });
}

/* ══════════════ 五度圈 ══════════════ */
/* 从顶部 C 开始顺时针纯五度：KEYS 索引序列 */
var CIRC = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5];
function keyIdxByPc(pc) {
  for (var i = 0; i < KEYS.length; i++) {
    if (((LETTER_PC[KEYS[i].L] + KEYS[i].a + 24) % 12 + 12) % 12 === pc) return i;
  }
  return 0;
}
function polarPt(r, deg) {
  var a = deg * Math.PI / 180;
  return [180 + r * Math.cos(a), 182 + r * Math.sin(a)];
}
function annulus(a0, a1, r1, r2) {
  var p1 = polarPt(r2, a0), p2 = polarPt(r2, a1), p3 = polarPt(r1, a1), p4 = polarPt(r1, a0);
  return 'M' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
    ' A' + r2 + ' ' + r2 + ' 0 0 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
    ' L' + p3[0].toFixed(2) + ' ' + p3[1].toFixed(2) +
    ' A' + r1 + ' ' + r1 + ' 0 0 0 ' + p4[0].toFixed(2) + ' ' + p4[1].toFixed(2) + ' Z';
}
function circText(svg, r, deg, txt, size, fill, weight) {
  var p = polarPt(r, deg);
  var t = sv('text', {
    x: p[0].toFixed(1), y: p[1].toFixed(1), 'font-size': size,
    'text-anchor': 'middle', 'dominant-baseline': 'central',
    fill: fill, 'font-weight': weight || 600, 'letter-spacing': '.3'
  });
  t.textContent = txt;
  t.style.pointerEvents = 'none';
  svg.appendChild(t);
}
function renderCircle() {
  var svg = $('#circleSvg');
  svg.innerHTML = '';
  var circ = state.circle;                      /* 五度圈独立选中状态，与调式切换无关 */
  var G = 1.6;

  CIRC.forEach(function (ki, i) {
    var a0 = -90 + i * 30, a1 = a0 + 30, mid = a0 + 15;
    var key = KEYS[ki];
    var majScale = buildScale(key, [0, 2, 4, 5, 7, 9, 11]);
    var minName = noteName(majScale[5]);
    var minLC = minName.charAt(0).toLowerCase() + minName.slice(1);
    var majOn = circ.mode === 'major' && circ.tonic === ki;
    var minOn = circ.mode === 'minor' && circ.tonic === keyIdxByPc(majScale[5].pc);

    /* 外圈：大调（大写字母） */
    var pm = sv('path', {
      d: annulus(a0 + G, a1 - G, 122, 172),
      fill: majOn ? '#8ba79a' : '#f0efe9',
      stroke: '#eae8e3', 'stroke-width': 1, 'class': 'segM'
    });
    pm.addEventListener('click', function () {
      if (circ.mode !== 'major' || circ.tonic !== ki) { state.circle = { mode: 'major', tonic: ki }; renderCircle(); }
    });
    svg.appendChild(pm);
    circText(svg, 150, mid, keyName(key), 18, majOn ? '#ffffff' : '#3d443f', 700);
    /* 同音异名：外圈副拼写（C♯ 对 D♭ 等） */
    if (key.alt) circText(svg, 130, mid, key.alt, 9.5, majOn ? 'rgba(255,255,255,.85)' : '#8f978f', 500);

    /* 内圈：关系小调（小写字母） */
    var pn = sv('path', {
      d: annulus(a0 + G, a1 - G, 76, 118),
      fill: minOn ? '#a4b8ab' : '#e7e9e3',
      stroke: '#eae8e3', 'stroke-width': 1, 'class': 'segM'
    });
    pn.addEventListener('click', function () {
      var mi = keyIdxByPc(majScale[5].pc);
      if (circ.mode !== 'minor' || circ.tonic !== mi) { state.circle = { mode: 'minor', tonic: mi }; renderCircle(); }
    });
    svg.appendChild(pn);
    circText(svg, 100, mid, minLC, 13.5, minOn ? '#ffffff' : '#6f776f', 650);
    /* 同音异名：内圈副拼写（g♭ 对 f♯、a♯ 对 b♭ 等） */
    var minAlt = null;
    for (var k2 = 0; k2 < KEYS.length; k2++) {
      var kk2 = KEYS[k2];
      var pc2 = ((LETTER_PC[kk2.L] + kk2.a + 24) % 12 + 12) % 12;
      if (pc2 === majScale[5].pc) {
        /* 主名与 minName 相同 → 副名取该条目的 alt；不同 → 主名即副名 */
        minAlt = (keyName(kk2) === minName) ? (kk2.alt || null) : keyName(kk2);
        break;
      }
    }
    if (minAlt) {
      minAlt = minAlt.charAt(0).toLowerCase() + minAlt.slice(1);
      circText(svg, 84, mid, minAlt, 9, minOn ? 'rgba(255,255,255,.85)' : '#8f978f', 500);
    }
  });

  /* 中心信息 */
  var hub = sv('circle', { cx: 180, cy: 182, r: 70, fill: '#fbfaf7', stroke: '#dedad3' });
  hub.style.pointerEvents = 'none';
  svg.appendChild(hub);
  function hubText(dy, txt, size, fill, weight, spacing) {
    var t = sv('text', {
      x: 180, y: 182 + dy, 'font-size': size, 'text-anchor': 'middle',
      'dominant-baseline': 'central', fill: fill,
      'font-weight': weight || 500, 'letter-spacing': spacing || '.5'
    });
    t.textContent = txt;
    t.style.pointerEvents = 'none';
    svg.appendChild(t);
  }
  var ck = KEYS[circ.tonic];
  var cname0 = keyName(ck);
  var clow = cname0.charAt(0).toLowerCase() + cname0.slice(1);
  hubText(-18, circ.mode === 'major' ? cname0 + ' 大调' : clow + ' 小调', 17, '#6a887a', 700, '1');
  hubText(4, circ.mode === 'major' ? '自然大调' : '自然小调', 10.5, '#6f776f', 500, '1.5');
  hubText(22, 'CIRCLE OF FIFTHS', 8, '#b3b0a9', 500, '1.6');
}

function render() {
  model = buildModel();
  renderScaleUI();
  renderKeys();
  renderInfo();
  renderCards();
  renderCircle();
}

/* ══════════════ 播放 ══════════════ */
function flash(cardEl) {
  cardEl.classList.remove('flash');
  void cardEl.offsetWidth;
  cardEl.classList.add('flash');
  setTimeout(function () { cardEl.classList.remove('flash'); }, 460);
}

function playCard(card) {
  var midis = invert(card.seventh, state.inv).map(function (n) { return n.midi; });
  lightKeys(midis);
  var low = midis[0] - 12;
  playNotes(midis, 0.55, 2.8, 0.014, function (t) {
    if (low >= 24) pluck(low, t + 0.024, 0.34, 2.8);
  });
}

/* 停止一切发声与高亮 */
function stopPlayback() {
  stopAllVoices();
  clearKeys();
  var a = document.querySelectorAll('.card.playing');
  for (var i = 0; i < a.length; i++) a[i].classList.remove('playing');
}
/* ══════════════ 事件 ══════════════ */
document.addEventListener('pointerdown', function () { ensureAudio(); }, { passive: true });

$('#keys').addEventListener('click', function (e) {
  var b = e.target.closest('.key');
  if (!b) return;
  var idx = +b.dataset.idx;
  if (idx === state.tonic) return;
  state.tonic = idx;
  stopPlayback();
  render();
});

$('#scaleSel').addEventListener('change', function () {
  state.scaleIdx = +this.value;
  stopPlayback();
  render();
});

$('#churchRow').addEventListener('click', function (e) {
  var b = e.target.closest('.chip');
  if (!b) return;
  var ci = +b.dataset.ci;
  if (ci === state.churchIdx) return;
  state.churchIdx = ci;
  stopPlayback();
  render();
});

$('#invSeg').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  var v = +b.dataset.inv;
  if (state.inv === v) return;
  state.inv = v;
  var kids = this.querySelectorAll('button');
  for (var i = 0; i < kids.length; i++) kids[i].classList.toggle('on', kids[i] === b);
  stopPlayback();
  render();
});

$('#grid').addEventListener('click', function (e) {
  var cardEl = e.target.closest('.card');
  if (!cardEl) return;
  var card = model.cards[+cardEl.dataset.pos];
  if (!card) return;
  playCard(card);
  flash(cardEl);
  cardEl.classList.add('playing');
  setTimeout(function () { cardEl.classList.remove('playing'); }, 260);
});

$('#grid').addEventListener('pointerdown', function (e) {
  var c = e.target.closest('.card');
  if (c) c.classList.add('press');
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
  document.addEventListener(ev, function () {
    var a = document.querySelectorAll('.card.press');
    for (var i = 0; i < a.length; i++) a[i].classList.remove('press');
  }, true);
});

/* 点击琴键直接试音 */
$('#piano').addEventListener('click', function (e) {
  var k = e.target.closest('.pk');
  if (!k) return;
  var m = +k.dataset.midi;
  ensureAudio();
  pluck(m, A.ctx.currentTime + 0.01, 0.6, 2.6);
  lightKeys([m], true);
});

/* ══════════════ 启动 ══════════════ */
buildPiano();
render();

/* 供控制台调试/扩展使用 */
window.__chord = {
  KEYS: KEYS, LETTERS: LETTERS, accStr: accStr, SCALES: SCALES, CHURCH: CHURCH,
  get state() { return state; },
  get model() { return model; },
  get audio() { return A; },
  render: render,
  set: function (tonic, scaleIdx, churchIdx, inv) {
    if (tonic != null) state.tonic = tonic;
    if (scaleIdx != null) state.scaleIdx = scaleIdx;
    if (churchIdx != null) state.churchIdx = churchIdx;
    if (inv != null) state.inv = inv;
    render();
  }
};

})();

/* PWA：静态资源需带访问凭据（sharecode），此处统一拼接 */
(function () {
  var sc = '';
  try { sc = new URLSearchParams(location.search).get('sharecode') || ''; } catch (e) {}
  var SUF = sc ? '?sharecode=' + encodeURIComponent(sc) : '';
  var ml = document.createElement('link');
  ml.rel = 'manifest';
  ml.href = 'manifest.json' + SUF;
  document.head.appendChild(ml);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js' + SUF).catch(function () {});
    });
  }
})();
</script>
</body>
